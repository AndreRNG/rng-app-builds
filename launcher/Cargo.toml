[package]
name = "rng-studio"
version = "0.1.0"
edition = "2021"
description = "RNG Studio: installs, opens and updates RNG Media's apps"
license = "LicenseRef-RNG-Media"
publish = false

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
dirs = "6"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
self-replace = "1"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 4
