name: Build app

# Builds one RNG app for Linux, Windows and macOS from the public upstream source at the commit
# in patches/<app>.base plus the RNG patch in patches/<app>.patch, then attaches the packages to a
# GitHub release "<app>-b<run>" together with <app>.json (version, build, sha256 per platform).
on:
  workflow_dispatch:
    inputs:
      app:
        description: "App id from apps.json"
        type: choice
        options: [cutcat, photofalcon, pdfrog, docduck, slideseal, vectorviper, effectopus]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: "true"

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.meta.outputs.name }}
      tagline: ${{ steps.meta.outputs.tagline }}
      upstream: ${{ steps.meta.outputs.upstream }}
      pkg: ${{ steps.meta.outputs.pkg }}
      bin: ${{ steps.meta.outputs.bin }}
      wm_class: ${{ steps.meta.outputs.wm_class }}
      base: ${{ steps.meta.outputs.base }}
      version: ${{ steps.ver.outputs.version }}
      build: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: meta
        run: |
          app='${{ inputs.app }}'
          for k in name tagline upstream pkg bin wm_class; do
            echo "$k=$(jq -r --arg a "$app" '.[$a].'"$k" apps.json)" >> "$GITHUB_OUTPUT"
          done
          echo "base=$(cat patches/$app.base)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ steps.meta.outputs.upstream }}
          ref: ${{ steps.meta.outputs.base }}
          path: src
          persist-credentials: false
      - id: ver
        run: echo "version=$(grep -m1 '^version *=' src/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

  build:
    needs: prep
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64,    runner: ubuntu-22.04 }
          - { platform: windows-x86_64,  runner: windows-latest }
          - { platform: macos-universal, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      APP: ${{ inputs.app }}
      NAME: ${{ needs.prep.outputs.name }}
      PKG: ${{ needs.prep.outputs.pkg }}
      BIN: ${{ needs.prep.outputs.bin }}
      VERSION: ${{ needs.prep.outputs.version }}
      BUILD: ${{ needs.prep.outputs.build }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Git setup (Windows)
        if: runner.os == 'Windows'
        run: |
          git config --system core.longpaths true
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: meta
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ needs.prep.outputs.upstream }}
          ref: ${{ needs.prep.outputs.base }}
          path: src
          persist-credentials: false
      - name: Apply RNG patch
        run: |
          cd src
          git -c user.name=rng -c user.email=rng@localhost am --keep-cr --whitespace=nowarn "../meta/patches/$APP.patch"
          git log --oneline -2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Hide build paths in the binaries
        run: |
          ws="$GITHUB_WORKSPACE"; ch="${CARGO_HOME:-$HOME/.cargo}"; rh="${RUSTUP_HOME:-$HOME/.rustup}"
          if [ "$RUNNER_OS" = Windows ]; then ws=$(cygpath -w "$ws"); ch=$(cygpath -w "$ch"); rh=$(cygpath -w "$rh"); fi
          echo "RUSTFLAGS=--remap-path-prefix=$ws=/build --remap-path-prefix=$ch=/cargo --remap-path-prefix=$rh=/rustup" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src
          key: ${{ inputs.app }}-${{ matrix.platform }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev libasound2-dev pkg-config

      - name: Build (Linux / Windows)
        if: runner.os != 'macOS'
        working-directory: src
        run: cargo build --release --locked -p "$PKG"
      - name: Build (macOS universal)
        if: runner.os == 'macOS'
        working-directory: src
        run: |
          cargo build --release --locked -p "$PKG" --target aarch64-apple-darwin
          cargo build --release --locked -p "$PKG" --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output "target/release/$BIN" \
            "target/aarch64-apple-darwin/release/$BIN" "target/x86_64-apple-darwin/release/$BIN"

      - name: Package
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          mkdir -p out
          stem="$NAME-$VERSION-b$BUILD-${{ matrix.platform }}"
          docs="src/LICENSE-MIT src/LICENSE-APACHE src/NOTICE"
          [ -f src/MODIFICATIONS.md ] && docs="$docs src/MODIFICATIONS.md"
          [ -d src/licenses ] && docs="$docs src/licenses"
          [ -d src/licences ] && docs="$docs src/licences"
          case "${{ runner.os }}" in
            Linux)
              mkdir -p "pkg/$NAME"
              cp "src/target/release/$BIN" "pkg/$NAME/" && cp -R $docs "pkg/$NAME/"
              cp "meta/icons/$APP.png" "pkg/$NAME/icon.png"
              tar -C pkg -czf "out/$stem.tar.gz" "$NAME"
              echo "exe=$NAME/$BIN" > out/exe.txt ;;
            Windows)
              mkdir -p "pkg/$NAME"
              cp "src/target/release/$BIN.exe" "pkg/$NAME/" && cp -R $docs "pkg/$NAME/"
              cp "meta/icons/$APP.png" "pkg/$NAME/icon.png"
              (cd pkg && 7z a -tzip -mx=7 "../out/$stem.zip" "$NAME" >/dev/null)
              echo "exe=$NAME/$BIN.exe" > out/exe.txt ;;
            macOS)
              app="pkg/$NAME.app/Contents"
              mkdir -p "$app/MacOS" "$app/Resources"
              cp "src/target/release/$BIN" "$app/MacOS/"
              cp -R $docs "$app/Resources/"
              set=icon.iconset; mkdir -p $set
              for s in 16 32 128 256 512; do
                sips -z $s $s "meta/icons/$APP.png" --out "$set/icon_${s}x${s}.png" >/dev/null
                d=$((s*2)); [ $d -le 512 ] && sips -z $d $d "meta/icons/$APP.png" --out "$set/icon_${s}x${s}@2x.png" >/dev/null
              done
              iconutil -c icns $set -o "$app/Resources/AppIcon.icns"
              cat > "$app/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>$NAME</string>
            <key>CFBundleDisplayName</key><string>$NAME</string>
            <key>CFBundleIdentifier</key><string>media.rng.$APP</string>
            <key>CFBundleExecutable</key><string>$BIN</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$BUILD</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSHumanReadableCopyright</key><string>RNG Media S.L. Based on open-source code (MIT/Apache-2.0), see NOTICE.</string>
            <key>NSMicrophoneUsageDescription</key><string>$NAME uses the microphone only when you record audio.</string>
          </dict></plist>
          EOF
              ent="meta/mac/entitlements/$APP.plist"; [ -f "$ent" ] || ent=meta/mac/entitlements/default.plist
              # Signed + notarized .zip (RNG Studio installs it) and drag-to-Applications .dmg (people).
              meta/scripts/macos-sign.sh "pkg/$NAME.app" out "$stem" "$ent"
              echo "exe=$NAME.app" > out/exe.txt ;;
          esac
          mv out/exe.txt "out/${{ matrix.platform }}.exe.txt"
          ls -la out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.platform }}
          path: out/*
          retention-days: 3

  release:
    needs: [prep, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      APP: ${{ inputs.app }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Manifest entry + release
        run: |
          cd dist
          ls -la
          plat='{}'
          for f in *.tar.gz *.zip; do
            [ -e "$f" ] || continue
            p=$(echo "$f" | sed -E 's/.*-b[0-9]+-(.*)\.(tar\.gz|zip)$/\1/')
            exe=$(cut -d= -f2- "$p.exe.txt")
            plat=$(jq --arg p "$p" --arg f "$f" --arg s "$(sha256sum "$f" | cut -d' ' -f1)" \
              --argjson n "$(stat -c%s "$f")" --arg e "$exe" \
              '. + {($p): {file: $f, sha256: $s, size: $n, exe: $e}}' <<<"$plat")
          done
          jq -n --arg id "$APP" --arg name '${{ needs.prep.outputs.name }}' --arg tag '${{ needs.prep.outputs.tagline }}' --arg wm '${{ needs.prep.outputs.wm_class }}' \
            --arg v '${{ needs.prep.outputs.version }}' --argjson b '${{ needs.prep.outputs.build }}' \
            --arg base '${{ needs.prep.outputs.base }}' --argjson plat "$plat" \
            '{id:$id, name:$name, tagline:$tag, wm_class:$wm, version:$v, build:$b, upstream_commit:$base, platforms:$plat}' > "$APP.json"
          cat "$APP.json"
          [ "$(jq '.platforms|length' "$APP.json")" -gt 0 ] || exit 1
          gh release create "$APP-b${{ needs.prep.outputs.build }}" -R "${{ github.repository }}" \
            --title "${{ needs.prep.outputs.name }} ${{ needs.prep.outputs.version }} (build ${{ needs.prep.outputs.build }})" \
            --notes "Platforms: $(jq -r '.platforms|keys|join(", ")' "$APP.json")" \
            *.tar.gz *.zip $(ls *.dmg 2>/dev/null) "$APP.json"
