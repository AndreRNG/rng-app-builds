name: Build RNG Studio

# Builds the launcher for Linux, Windows and macOS (universal) and makes a release
# "studio-b<run>" with the downloads and studio.json (sha256 per platform).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["launcher/**", ".github/workflows/launcher.yml"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RNG_STUDIO_BUILD: ${{ github.run_number }}
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64,    runner: ubuntu-22.04 }
          - { platform: windows-x86_64,  runner: windows-latest }
          - { platform: macos-universal, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Hide build paths in the binaries
        run: |
          ws="$GITHUB_WORKSPACE"; ch="${CARGO_HOME:-$HOME/.cargo}"; rh="${RUSTUP_HOME:-$HOME/.rustup}"
          if [ "$RUNNER_OS" = Windows ]; then ws=$(cygpath -w "$ws"); ch=$(cygpath -w "$ch"); rh=$(cygpath -w "$rh"); fi
          echo "RUSTFLAGS=--remap-path-prefix=$ws=/build --remap-path-prefix=$ch=/cargo --remap-path-prefix=$rh=/rustup" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: launcher
          key: ${{ matrix.platform }}
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxi-dev libgl1-mesa-dev pkg-config
      - name: Build
        working-directory: launcher
        run: |
          if [ "${{ runner.os }}" = macOS ]; then
            cargo build --release --target aarch64-apple-darwin
            cargo build --release --target x86_64-apple-darwin
            mkdir -p target/release
            lipo -create -output target/release/rng-studio \
              target/aarch64-apple-darwin/release/rng-studio target/x86_64-apple-darwin/release/rng-studio
          else
            cargo build --release
          fi
      - name: Package
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          mkdir -p out pkg
          v=$(grep -m1 '^version' launcher/Cargo.toml | cut -d'"' -f2)
          stem="RNG-Studio-$v-b${{ github.run_number }}-${{ matrix.platform }}"
          case "${{ runner.os }}" in
            Linux)
              mkdir -p "pkg/RNG Studio"
              cp launcher/target/release/rng-studio "pkg/RNG Studio/"
              tar -C pkg -czf "out/$stem.tar.gz" "RNG Studio"
              echo "RNG Studio/rng-studio" > "out/${{ matrix.platform }}.exe.txt" ;;
            Windows)
              cp launcher/target/release/rng-studio.exe "out/$stem.exe"
              echo "$stem.exe" > "out/${{ matrix.platform }}.exe.txt" ;;
            macOS)
              c="pkg/RNG Studio.app/Contents"
              mkdir -p "$c/MacOS" "$c/Resources"
              cp launcher/target/release/rng-studio "$c/MacOS/"
              set=icon.iconset; mkdir -p $set
              for s in 16 32 128 256 512; do
                sips -z $s $s icons/studio.png --out "$set/icon_${s}x${s}.png" >/dev/null
                d=$((s*2)); [ $d -le 512 ] && sips -z $d $d icons/studio.png --out "$set/icon_${s}x${s}@2x.png" >/dev/null
              done
              iconutil -c icns $set -o "$c/Resources/AppIcon.icns"
              cat > "$c/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>RNG Studio</string>
            <key>CFBundleDisplayName</key><string>RNG Studio</string>
            <key>CFBundleIdentifier</key><string>media.rng.studio</string>
            <key>CFBundleExecutable</key><string>rng-studio</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$v</string>
            <key>CFBundleVersion</key><string>${{ github.run_number }}</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSHumanReadableCopyright</key><string>© RNG Media S.L.</string>
          </dict></plist>
          EOF
              scripts/macos-sign.sh "pkg/RNG Studio.app"
              ditto -c -k --keepParent "pkg/RNG Studio.app" "out/$stem.zip"
              echo "RNG Studio.app" > "out/${{ matrix.platform }}.exe.txt"
              # Drag-to-Applications disk image for people downloading it by hand.
              mkdir -p dmg && cp -R "pkg/RNG Studio.app" dmg/ && ln -s /Applications dmg/Applications
              hdiutil create -volname "RNG Studio" -srcfolder dmg -ov -format UDZO "out/RNG-Studio-$v-b${{ github.run_number }}-macos.dmg"
              if [ -n "${APPLE_API_KEY:-}" ]; then
                echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
                xcrun notarytool submit out/*.dmg --key "$RUNNER_TEMP/key.p8" --key-id "$APPLE_API_KEY_ID" \
                  --issuer "$APPLE_API_ISSUER" --wait --timeout 30m && xcrun stapler staple out/*.dmg
                rm -f "$RUNNER_TEMP/key.p8"
              fi ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: out/*
          retention-days: 3

  release:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Manifest entry + release
        run: |
          v=$(grep -m1 '^version' launcher/Cargo.toml | cut -d'"' -f2)
          b=${{ github.run_number }}
          cd dist
          plat='{}'
          for p in linux-x86_64 windows-x86_64 macos-universal; do
            [ -f "$p.exe.txt" ] || continue
            case $p in linux*) f=$(ls *-$p.tar.gz);; windows*) f=$(ls *-$p.exe);; macos*) f=$(ls *-$p.zip);; esac
            plat=$(jq --arg p "$p" --arg f "$f" --arg s "$(sha256sum "$f" | cut -d' ' -f1)" \
              --argjson n "$(stat -c%s "$f")" --arg e "$(cat "$p.exe.txt")" \
              '. + {($p): {file: $f, sha256: $s, size: $n, exe: $e}}' <<<"$plat")
          done
          jq -n --arg v "$v" --argjson b "$b" --argjson plat "$plat" \
            '{id:"studio", name:"RNG Studio", version:$v, build:$b, platforms:$plat}' > studio.json
          cat studio.json
          gh release create "studio-b$b" -R "${{ github.repository }}" --title "RNG Studio $v (build $b)" \
            --notes "Launcher build" *.tar.gz *.zip *.exe *.dmg studio.json
